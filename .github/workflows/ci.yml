name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: JVM, Android and Linux Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon check koverVerify koverXmlReport koverHtmlReport :orcex-render-android:lintDebug :orcex-font-stix2-android:lintDebug :orcex-render-skia:linuxX64Klib
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover
      - uses: actions/upload-artifact@v7
        with:
          name: formula-previews
          path: |
            **/build/previews/*.png
            **/build/skia-test-snapshots/*.png

  native-hosts:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon :orcex-core:allTests :orcex-layout:allTests :orcex-render-compose:jvmTest
      - if: runner.os == 'macOS'
        run: ./gradlew --no-daemon :orcex-render-skia:macosArm64Klib :orcex-render-compose:iosSimulatorArm64Klib
