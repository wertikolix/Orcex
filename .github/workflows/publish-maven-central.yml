name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        type: string
      publishing_type:
        description: Central Portal publication behavior
        required: true
        default: USER_MANAGED
        type: choice
        options: [USER_MANAGED, AUTOMATIC]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve release settings
        shell: bash
        run: |
          version='${{ inputs.version }}'
          publishing_type='${{ inputs.publishing_type }}'
          if [[ -z "${version}" || "${version}" == *SNAPSHOT* ]]; then
            echo 'Only non-SNAPSHOT versions can be released.' >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${version}" >> "${GITHUB_ENV}"
          echo "BUNDLE_FILE=build/distributions/orcex-${version}-central-bundle.zip" >> "${GITHUB_ENV}"
          echo "PUBLISHING_TYPE=${publishing_type}" >> "${GITHUB_ENV}"
      - name: Build signed Central bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon clean centralBundleZip
      - uses: actions/upload-artifact@v7
        with:
          name: maven-central-bundle
          path: ${{ env.BUNDLE_FILE }}
      - name: Upload to Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          token="$(printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_PASSWORD}" | base64 -w0)"
          deployment_id="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --form "bundle=@${BUNDLE_FILE};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=Orcex-${ORG_GRADLE_PROJECT_VERSION_NAME}&publishingType=${PUBLISHING_TYPE}")"
          echo "Central deployment: ${deployment_id}"
          echo "${deployment_id}" > central-deployment-id.txt
      - uses: actions/upload-artifact@v7
        with:
          name: maven-central-deployment-id
          path: central-deployment-id.txt
